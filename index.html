<!DOCTYPE html>
<html lang="ceb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>G &amp; G Swine Breeding Farm — Records</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15291F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#15291F;
  --ink-2:#1D3A2C;
  --paper:#ECF0E9;
  --card:#FFFFFF;
  --line:#D6DED3;
  --line-soft:#E8EDE5;
  --text:#1B241F;
  --muted:#61705F;
  --tag:#F2C230;
  --tag-edge:#C09312;
  --alert:#B93A26;
  --alert-bg:#FBEDE9;
  --good:#2C7A4F;
  --good-bg:#E9F3EC;
  --warn:#A86A0B;
  --warn-bg:#FBF2E0;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:76px;
}
input,select,textarea,button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.015em;line-height:1.2}
h1{font-size:19px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
a{color:var(--ink-2)}

/* ---------- shell ---------- */
header.top{
  background:var(--ink);color:#EFF3EC;
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:40;
}
header.top .brand{font-weight:700;letter-spacing:-.02em;font-size:16px}
header.top .when{margin-left:auto;font-size:12px;color:#A9BCA9;text-align:right;line-height:1.3}
.synced{background:#294438;border:1px solid #3A5A49;color:#9DB89E;border-radius:999px;
  width:28px;height:28px;font-size:13px;line-height:1;padding:0;cursor:pointer;flex:none}
.synced.ok{color:#8FE0A6;border-color:#3F7A55}
.synced.bad{color:#F2A28E;border-color:#7A4A3F}
.synced.busy{color:var(--tag)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#101A14;color:#CFE3CB;
  padding:10px 11px;border-radius:8px;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
.encoder{background:#294438;border:1px solid #3A5A49;color:#DCE7DA;border-radius:999px;padding:4px 10px;font-size:12px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding:12px 12px 24px;max-width:900px;margin:0 auto}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);display:grid;grid-template-columns:repeat(var(--tabn,6),1fr);
  padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid #2C4A3A;
}
nav.tabs button{
  background:none;border:0;color:#8FA790;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;cursor:pointer;
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--tag)}
@media(min-width:880px){
  body{padding-bottom:0;display:grid;grid-template-columns:186px 1fr;grid-template-rows:auto 1fr}
  header.top{grid-column:1/-1}
  nav.tabs{position:sticky;top:44px;height:calc(100vh - 44px);bottom:auto;grid-template-columns:1fr;align-content:start;border-top:0;border-right:1px solid #2C4A3A;padding:10px 8px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:13.5px;padding:10px 12px;border-radius:8px}
  nav.tabs button.on{background:#233B2E}
  main{padding:18px 22px 60px}
}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:11px}
.card.tight{padding:10px 12px}
.sect-head{display:flex;align-items:center;gap:8px;margin:18px 0 9px}
.sect-head:first-child{margin-top:2px}
.sect-head .count{margin-left:auto;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:10px 0}

/* ear tag chip — plastic tag look */
.tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--tag);border:1px solid var(--tag-edge);
  color:#3D2E00;font-weight:700;font-variant-numeric:tabular-nums;
  padding:2px 9px 2px 7px;border-radius:4px 8px 8px 4px;font-size:13px;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#3D2E0033;box-shadow:inset 0 1px 0 #0002}
.tag.sm{font-size:11.5px;padding:1px 7px 1px 6px}
.tag.boar{background:#D9E4EF;border-color:#9DB4CB;color:#1E3A54}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.pill.g{background:var(--good-bg);color:var(--good);border-color:#BEDCC8}
.pill.r{background:var(--alert-bg);color:var(--alert);border-color:#EDC6BC}
.pill.w{background:var(--warn-bg);color:var(--warn);border-color:#EDD9AC}
.pill.n{background:#EDF0EA;color:var(--muted);border-color:var(--line)}

button.btn{
  background:var(--ink-2);color:#F1F5EE;border:0;border-radius:8px;
  padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;
}
button.btn:active{transform:translateY(1px)}
button.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
button.btn.tag{background:var(--tag);color:#3D2E00}
button.btn.danger{background:#fff;color:var(--alert);border:1px solid #EDC6BC}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:7px}
button.btn.wide{width:100%}
button.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
:focus-visible{outline:2.5px solid #2C7A4F;outline-offset:2px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}

/* task lines */
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.task:last-child{border-bottom:0}
.task .when{min-width:52px;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.task .body{flex:1;min-width:0}
.task .body .t{font-weight:600;font-size:14px}
.task .body .d{font-size:12.5px;color:var(--muted)}
.task.late{background:linear-gradient(90deg,var(--alert-bg),transparent 60%);border-left:3px solid var(--alert);padding-left:8px;margin-left:-8px}
.task.due{border-left:3px solid var(--tag);padding-left:8px;margin-left:-8px}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}

/* the A.I. window panel — the one loud element */
.aiwin{background:var(--ink);color:#EAF1E7;border-radius:var(--radius);padding:14px;margin-bottom:11px;border:1px solid #2C4A3A}
.aiwin .lbl{font-size:12px;color:#9DB89E}
.aiwin .clock{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 1px}
.aiwin.open{background:#1B4A2F;border-color:#2E7A4C}
.aiwin.open .clock{color:#B6F0C9}
.aiwin .win{font-size:13px;color:#C9DAC6}
.aiwin .row{margin-top:9px}

.listitem{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:7px;cursor:pointer;width:100%;text-align:left}
.listitem .meta{flex:1;min-width:0}
.listitem .meta .l1{font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.listitem .meta .l2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .chev{color:#A8B5A6;font-size:18px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* timeline */
.tl{position:relative;padding-left:20px;margin:4px 0}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .n{position:relative;padding:6px 0}
.tl .n::before{content:"";position:absolute;left:-18px;top:12px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl .n.ok::before{background:var(--good);border-color:var(--good)}
.tl .n.now::before{background:var(--tag);border-color:var(--tag-edge)}
.tl .n .t{font-weight:600;font-size:13.5px}
.tl .n .s{font-size:12px;color:var(--muted)}

/* forms + modal */
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;
}
.field textarea{min-height:66px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:#0D170FAA;z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 15px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{border-radius:14px}}
.modal h2{margin-bottom:3px}
.modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.modal .acts{display:flex;gap:9px;margin-top:14px}
.modal .acts button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#EAF1E7;padding:10px 16px;border-radius:999px;z-index:200;font-size:13.5px;max-width:88vw;text-align:center;box-shadow:0 6px 20px #0003}
@media(min-width:880px){.toast{bottom:26px}}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:3px}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.chipbar button{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.chipbar button.on{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.backlink{background:none;border:0;color:var(--muted);font-size:13px;padding:0 0 8px;cursor:pointer;font-weight:600}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--good)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- receipt lines ---------- */
.lrow{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px}
.lrow .top{display:flex;gap:7px;align-items:center}
.lrow .top input{flex:1;min-width:0}
.lrow .top button{background:none;border:0;color:var(--alert);font-size:19px;line-height:1;padding:0 3px;cursor:pointer}
.lrow .bot{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center;margin-top:7px}
.lrow input{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:15px;width:100%}
.lrow .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;text-align:right;min-width:74px}
.lcap{font-size:10.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.ltotal{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;background:var(--ink);
  color:#EAF1E7;border-radius:9px;margin-top:4px;font-weight:700}
.ltotal b{font-size:19px;font-variant-numeric:tabular-nums}

/* ---------- sign in ---------- */
body.out{padding-bottom:0}
body.out nav.tabs{display:none}
@media(min-width:880px){body.out{grid-template-columns:1fr}}
.signin{max-width:430px;margin:4vh auto 0}
.signin .logo{display:block;width:160px;max-width:52%;margin:0 auto 14px}
.signin h1{font-size:23px;margin-bottom:4px}
.signin .lead{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.utile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer}
.utile .av{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--tag);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.utile .nm{font-weight:600;font-size:15px}
.utile .rl{font-size:12px;color:var(--muted)}
.pinbox{letter-spacing:.5em;text-align:center;font-size:22px!important;font-variant-numeric:tabular-nums}
.roletag{display:inline-block;background:#233B2E;color:#CFE3CB;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">G &amp; G Swine</div>
  <button class="encoder" id="encoderBtn">Entered by: —</button>
  <button class="synced" id="syncBtn" title="Cloud sync">○</button>
  <div class="when" id="todayLbl"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="modalHost"></div>
<script>
/* ============================================================
   PIGGERY RECORD  —  sows / piglets / fattening / money
   Single file. Saves on the device. Backup via export/import.
   ============================================================ */
const KEY='piggery_v1';
const DAY=86400000, HR=3600000;

/* ---------- default data ---------- */
function blank(){return{
  meta:{farm:'G & G Swine Breeding Farm', encoder:'', created:Date.now(), v:2},
  users:[], health:[], logins:[], tombs:[], collections:[], items:[],
  sows:[], boars:[], cycles:[], farrowings:[], tasks:[],
  nursery:[], fatten:[], flogs:[], feeds:[], expenses:[],
  workers:[], payroll:[], sales:[], notes:[]
};}
let db=blank();
let VIEW='dash', SUB=null, FILTER='tanan', Q='';

/* ---------- storage (artifact storage + localStorage fallback) ---------- */
async function load(){
  let raw=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; } }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ db=Object.assign(blank(), JSON.parse(raw)); }catch(e){} }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const s=JSON.stringify(db);
    try{ if(window.storage) await window.storage.set(KEY,s); }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
    queueSync();
  },120);
}

/* ---------- tiny helpers ---------- */
const uid=p=>(p||'x')+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
function todayISO(d){const t=d?new Date(d):new Date();return new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function nowLocal(){const t=new Date();return new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function startOf(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';
  return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function fshort(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return MON[d.getMonth()]+' '+d.getDate(); }
function ftime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'), ap=h<12?'am':'pm'; h=h%12||12; return h+':'+m+ap; }
function fdt(iso){ return iso? fdate(iso)+' '+ftime(iso) : '—'; }
function addD(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return todayISO(d); }
function dDiff(a,b){ return Math.round((startOf(b)-startOf(a))/DAY); } // b minus a, in days
function fromToday(iso){ return dDiff(todayISO(), iso); }
function ageDays(birth){ return birth? dDiff(birth, todayISO()) : null; }
function ageTxt(birth){ const d=ageDays(birth); if(d==null) return '—';
  const m=Math.floor(d/30.44); return m>=12? (Math.floor(m/12)+'y '+(m%12)+'mo') : (m+' mo '+(d-Math.round(m*30.44))+'d'); }
function peso(n){ return '\u20B1'+(Math.round(num(n)*100)/100).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function whenTxt(iso){ const n=fromToday(iso);
  if(n===0) return 'TODAY'; if(n===1) return 'TOMORROW'; if(n===-1) return 'YESTERDAY';
  return n<0? (Math.abs(n)+'d ago') : ('+'+n+'d'); }

/* ---------- lookups ---------- */
const sowOf=id=>db.sows.find(s=>s.id===id);
const boarOf=id=>db.boars.find(b=>b.id===id);
const tagOf=id=>{const s=sowOf(id);return s?s.tag:'?';};
const cycleOf=id=>db.cycles.find(c=>c.id===id);
const OPEN=['HEAT','BRED','PREGNANT'];
const openCycle=sid=>db.cycles.filter(c=>c.sowId===sid&&OPEN.includes(c.status)).sort((a,b)=>(b.heatAt||'').localeCompare(a.heatAt||''))[0]||null;
const openFarrow=sid=>db.farrowings.filter(f=>f.sowId===sid&&!f.weanDate).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
const sowCycles=sid=>db.cycles.filter(c=>c.sowId===sid).sort((a,b)=>(b.heatAt||'').localeCompare(a.heatAt||''));

/* ---------- status engine ---------- */
function sowState(s){
  if(s.status==='CULL') return {k:'CULL',label:'Culled / sold',cls:'n'};
  const f=openFarrow(s.id);
  if(f){ const d=dDiff(f.date, todayISO());
    return {k:'LACT',label:'Lactating (D'+d+')',cls:'g',sub:'Wean: '+fshort(f.weanPlan)}; }
  const c=openCycle(s.id);
  if(c){
    if(c.status==='HEAT'){
      const w=aiWindow(c.heatAt);
      return {k:'HEAT',label:'In heat — ready for A.I.',cls:'w',sub:'Breed: '+fshort(w.from)+' '+ftime(w.from)+'–'+ftime(w.to)};
    }
    if(c.status==='BRED') return {k:'BRED',label:'Bred (D'+dDiff(c.aiAt,todayISO())+') — watching',cls:'w',sub:'Due: '+fshort(c.dueDate)};
    if(c.status==='PREGNANT') return {k:'PREG',label:'Pregnant (D'+dDiff(c.aiAt,todayISO())+')',cls:'g',sub:'Due: '+fshort(c.dueDate)};
  }
  if(!s.parity){
    const d=ageDays(s.birth);
    if(d==null) return {k:'GILT',label:'Gilt — no birth date',cls:'n'};
    if(d<210) return {k:'GILT',label:'Gilt — '+Math.ceil((210-d))+'d to go',cls:'n',sub:'A.I. from '+fshort(addD(s.birth,210))};
    return {k:'GILTOK',label:'Gilt — ready for A.I.',cls:'w',sub:ageTxt(s.birth)};
  }
  return {k:'OPEN',label:'Open — waiting for heat',cls:'n'};
}

/* ---------- breeding math ---------- */
const AI_FROM=28, AI_TO=32;      // hrs from the moment heat is seen
const GEST=114;                   // days
const LACT=21;                    // days suckling
function aiWindow(heatAt){
  const t=new Date(heatAt).getTime();
  return {from:new Date(t+AI_FROM*HR).toISOString(), to:new Date(t+AI_TO*HR).toISOString()};
}
function aiState(heatAt){
  const w=aiWindow(heatAt), now=Date.now();
  const a=new Date(w.from).getTime(), b=new Date(w.to).getTime();
  if(now<a) return {s:'soon',ms:a-now,w};
  if(now<=b) return {s:'open',ms:b-now,w};
  return {s:'late',ms:now-b,w};
}
function hhmm(ms){
  const h=Math.floor(ms/HR), m=Math.floor((ms%HR)/60000);
  return h+'h '+String(m).padStart(2,'0')+'m';
}

/* ---------- task engine (no duplicates) ---------- */
function addTask(t){
  const k=[t.kind,t.ref||'',t.date].join('|');
  if(db.tasks.some(x=>x.key===k)) return null;
  db.tombs=db.tombs.filter(id=>id!==k);
  const task=Object.assign({id:uid('t'),key:k,done:false,by:''},t);
  db.tasks.push(task); return task;
}
function dropTasks(pred){
  const go=db.tasks.filter(t=>pred(t)&&!t.done);
  go.forEach(t=>db.tombs.push(t.id));
  db.tasks=db.tasks.filter(t=>!(pred(t)&&!t.done));
}
function doneTask(id,on){
  const t=db.tasks.find(x=>x.id===id); if(!t) return;
  t.done=on; t.doneAt=on?new Date().toISOString():null; t.by=on?who():'';
  save(); render();
}

/* ============================================================
   ACCOUNTS AND ROLES
   Each person signs in with their own PIN. What they can see and
   do depends on their role. Records are stamped with their name.

const ROLE={
  admin:   {label:'Admin / owner', blurb:'Everything, plus accounts, money and the review page.',
            tabs:['dash','sows','baktin','fat','health','kwarta','more'], groups:'*', can:'*'},
  manager: {label:'Manager', blurb:'All farm operations, feeds, money and the review page.',
            tabs:['dash','sows','baktin','fat','health','kwarta','more'], groups:'*',
            can:['breed','sowedit','health','pigs','feeds','money','sales','review']},
  aitech:  {label:'A.I. & health technician', blurb:'Heat, A.I., pregnancy checks, farrowing and sick pigs.',
            tabs:['dash','sows','health','more'], groups:['sow','health'], can:['breed','health']},
  caretaker:{label:'Caretaker / feeder', blurb:'Piglet program, fattening, feeds, and reporting sick pigs.',
            tabs:['dash','baktin','fat','health','more'], groups:['baktin','health'], can:['pigs','feeds','health']},
  sales:   {label:'Sales', blurb:'Records sales and sees what stock is ready.',
            tabs:['dash','sales','more'], groups:[], can:['sales']}
};
let SESSION=null;
const role=()=>SESSION?SESSION.role:'';
const who=()=>SESSION?SESSION.name:(db.meta.encoder||'');
function can(p){ const r=ROLE[role()]; if(!r) return false; return r.can==='*'||r.can.includes(p); }
function inScope(t){ const g=ROLE[role()]; if(!g) return false; if(g.groups==='*') return true;
  return g.groups.includes(t.group||'sow'); }
function pinHash(pin,id){ let h=0; const str=String(pin)+'|'+id;
  for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h.toString(36); }
function userOf(id){ return db.users.find(u=>u.id===id); }
function byUser(name){ const q=String(name||'').trim().toLowerCase();
  return db.users.find(u=>(u.username||'').toLowerCase()===q); }
function slug(name){ return String(name||'').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g,'')||'user'; }
function freeUser(base,skipId){
  let u=base, n=1;
  while(db.users.some(x=>x.id!==skipId&&(x.username||'').toLowerCase()===u)){ n++; u=base+n; }
  return u;
}
function migrateUsers(){                       // accounts made before usernames existed
  let touched=false;
  db.users.forEach(u=>{ if(!u.username){ u.username=freeUser(slug(u.name),u.id); touched=true; } });
  if(touched) save();
}
function signIn(u){
  SESSION={id:u.id,name:u.name,role:u.role};
  db.meta.encoder=u.name; u.lastIn=new Date().toISOString();
  db.logins.push({id:uid('li'),at:u.lastIn,user:u.name,role:u.role});
  if(db.logins.length>300) db.logins=db.logins.slice(-300);
  try{ localStorage.setItem('piggery_sess',u.id); }catch(e){}
  VIEW='dash'; SUB=null; save(); render(); toast('Welcome, '+u.name.split(' ')[0]+'.');
}
function signOut(){
  SESSION=null; try{ localStorage.removeItem('piggery_sess'); }catch(e){}
  LOGIN_PICK=null; VIEW='dash'; render();
}
function restoreSession(){
  let id=null; try{ id=localStorage.getItem('piggery_sess'); }catch(e){}
  const u=id?userOf(id):null;
  if(u&&u.active!==false){ SESSION={id:u.id,name:u.name,role:u.role}; db.meta.encoder=u.name; }
}
/* ============================================================
   SOW WORKFLOW
   HEAT -> A.I. -> check reheat (18-21 / 40 / 60) -> 114d farrowing
   ============================================================ */

/* 1) Seen in heat. Only one open cycle per sow. */
function reportHeat(sowId, heatAt, note, silent){
  const s=sowOf(sowId); if(!s) return;
  if(openFarrow(sowId)){ toast('Still lactating: '+s.tag+'. Wean her first.'); return; }
  const ex=openCycle(sowId);
  if(ex){
    if(ex.status==='HEAT'){
      // already reported — just update the time, never duplicate
      ex.heatAt=heatAt; ex.note=note||ex.note; refreshHeatTasks(ex);
      save(); if(!silent) toast('Heat time updated for '+s.tag+' (no duplicate).'); render(); return;
    }
    toast('There is already an open record for '+s.tag+' ('+ex.status+'). Use REHEAT instead.'); return;
  }
  const c={id:uid('c'),sowId,heatAt,status:'HEAT',note:note||'',by:db.meta.encoder,
           parityAt:s.parity||0, createdAt:new Date().toISOString(), ais:[], checks:[]};
  db.cycles.push(c); refreshHeatTasks(c); save();
  if(!silent) toast('Heat recorded for '+s.tag+'.');
  render();
}
function refreshHeatTasks(c){
  dropTasks(t=>t.ref===c.id&&t.kind==='AI');
  const w=aiWindow(c.heatAt);
  addTask({kind:'AI',ref:c.id,sowId:c.sowId,date:todayISO(w.from),
    title:'A.I. for '+tagOf(c.sowId),
    detail:'Breed at: '+ftime(w.from)+'–'+ftime(w.to)+' (28–32 hrs from '+ftime(c.heatAt)+')',group:'sow'});
}

/* 2) Na-A.I. */
function recordAI(cycleId, aiAt, boarId, tech, note){
  const c=cycleOf(cycleId); if(!c) return;
  c.ais=c.ais||[];
  if(c.ais.some(a=>a.at===aiAt)){ toast('This A.I. is already recorded.'); return; }
  c.ais.push({at:aiAt,boarId,tech:tech||'',note:note||'',by:db.meta.encoder});
  c.ais.sort((a,b)=>a.at.localeCompare(b.at));
  const last=c.ais[c.ais.length-1];
  c.aiFirst=c.ais[0].at;
  c.aiAt=last.at;                       // checks and due date run from the last dose
  c.boarId=last.boarId||c.ais[0].boarId;
  c.status='BRED';
  c.dueDate=addD(todayISO(c.aiAt), GEST);
  const s=sowOf(c.sowId); if(s&&!s.parity) s.parity=s.parity||0;
  dropTasks(t=>t.ref===c.id&&t.kind==='AI');
  buildPregChecks(c);
  save(); toast((c.ais.length>1?'Dose '+c.ais.length+' recorded. Counting from this one. ':'A.I. recorded. ')
    +'Due: '+fdate(c.dueDate)); render();
}
function buildPregChecks(c){
  dropTasks(t=>t.ref===c.id&&['RH1','RH2','RH3','FARROW','PREP'].includes(t.kind));
  const d0=todayISO(c.aiAt), tag=tagOf(c.sowId);
  addTask({kind:'RH1',ref:c.id,sowId:c.sowId,date:addD(d0,18),group:'sow',
    title:'Watch for reheat: '+tag,detail:'First check: D18–D21 after A.I. ('+fshort(addD(d0,18))+'–'+fshort(addD(d0,21))+')'});
  addTask({kind:'RH2',ref:c.id,sowId:c.sowId,date:addD(d0,40),group:'sow',
    title:'2nd check for '+tag,detail:'D40 after A.I. — reheat, or truly pregnant?'});
  addTask({kind:'RH3',ref:c.id,sowId:c.sowId,date:addD(d0,60),group:'sow',
    title:'3rd check for '+tag,detail:'D60 — if there is no reheat, pregnancy is confirmed'});
  addTask({kind:'PREP',ref:c.id,sowId:c.sowId,date:addD(d0,GEST-7),group:'sow',
    title:'Prepare the farrowing pen for '+tag,detail:'One week to go. Clean it, warm it, wash the sow.'});
  addTask({kind:'FARROW',ref:c.id,sowId:c.sowId,date:addD(d0,GEST),group:'sow',
    title:'Farrowing: '+tag,detail:'114 days from A.I. ('+fdate(c.aiAt)+')'});
}

function recalcCycle(c){
  c.ais=(c.ais||[]).sort((a,b)=>a.at.localeCompare(b.at));
  if(!c.ais.length){                                   // no service left — back to being in heat
    c.status='HEAT'; c.aiAt=null; c.aiFirst=null; c.dueDate=null; c.boarId=null;
    dropTasks(t=>t.ref===c.id); refreshHeatTasks(c); return;
  }
  const last=c.ais[c.ais.length-1];
  c.aiFirst=c.ais[0].at; c.aiAt=last.at; c.boarId=last.boarId||c.ais[0].boarId;
  c.dueDate=addD(todayISO(c.aiAt), GEST);
  if(c.status==='HEAT') c.status='BRED';
  buildPregChecks(c);
}
function editDose(cycleId, i){
  const c=cycleOf(cycleId), a=c.ais[i]; if(!a) return;
  modal('Edit dose '+(i+1)+' — '+tagOf(c.sowId),'Correcting this moves every check and the due date with it.',[
    {k:'at',label:'Date and time of this dose',type:'datetime-local',req:true,val:a.at},
    boarPicker('boarId'),
    {k:'tech',label:'Who did it',val:a.tech||''},
    {k:'note',label:'Notes',val:a.note||''}
  ],'Save',o=>{ a.at=o.at; a.boarId=o.boarId; a.tech=o.tech; a.note=o.note; a.editedBy=who();
    recalcCycle(c); save(); toast('Dates moved. Due: '+fdate(c.dueDate)); render(); });
  const e=$('f_boarId'); if(e) e.value=a.boarId||'';
}
function delDose(cycleId, i){
  const c=cycleOf(cycleId); if(!c||!c.ais[i]) return;
  confirmBox('Remove dose '+(i+1)+'? The checks will be worked out again from what is left.',()=>{
    c.ais.splice(i,1); recalcCycle(c); save();
    toast(c.ais.length?'Removed. Counting from '+fshort(c.aiAt)+'.':'All doses removed — she is back to being in heat.');
    render(); });
}
function editHeat(cycleId){
  const c=cycleOf(cycleId); if(!c) return;
  modal('Edit the heat time — '+tagOf(c.sowId),'This is the time she was first seen in heat.',[
    {k:'at',label:'Date and time seen in heat',type:'datetime-local',req:true,val:c.heatAt}
  ],'Save',o=>{ c.heatAt=o.at; if(c.status==='HEAT') refreshHeatTasks(c);
    save(); toast('Heat time corrected.'); render(); });
}
function delCycle(cycleId){
  const c=cycleOf(cycleId); if(!c) return;
  const f=db.farrowings.find(x=>x.cycleId===c.id);
  if(f) return toast('There is a farrowing on this record. Delete the litter first.');
  confirmBox('Delete this whole breeding record for '+tagOf(c.sowId)+'? The heat, the doses and the checks all go.',()=>{
    dropTasks(t=>t.ref===c.id);
    db.cycles=db.cycles.filter(x=>x.id!==c.id); db.tombs.push(c.id);
    save(); toast('Record deleted.'); render(); });
}
function delSow(id){
  const s=sowOf(id); if(!s) return;
  const cyc=db.cycles.filter(c=>c.sowId===id), far=db.farrowings.filter(f=>f.sowId===id);
  confirmBox('Delete '+s.tag+' completely? This also removes '+cyc.length+' breeding record(s) and '
    +far.length+' litter(s). Use this only for a sow entered twice by mistake — use Cull for one you sold.',()=>{
    const ids=[id].concat(cyc.map(c=>c.id), far.map(f=>f.id));
    dropTasks(t=>t.sowId===id||ids.includes(t.ref));
    db.cycles=db.cycles.filter(c=>c.sowId!==id);
    db.farrowings=db.farrowings.filter(f=>f.sowId!==id);
    db.nursery=db.nursery.filter(n=>!far.some(f=>f.id===n.farrowId));
    db.health=db.health.filter(h=>h.ref!==id);
    db.sows=db.sows.filter(x=>x.id!==id);
    db.tombs=db.tombs.concat(ids);
    save(); toast(s.tag+' deleted.'); go('sows'); });
}

/* 3) Reheat checks — one record per check. Auto-updates. */
function recordCheck(cycleId, which, result, date, note){
  const c=cycleOf(cycleId); if(!c) return;
  c.checks=(c.checks||[]).filter(x=>x.which!==which);      // no duplicates: replace the old one
  c.checks.push({which,result,date,note:note||'',by:db.meta.encoder,at:new Date().toISOString()});
  const t=db.tasks.find(x=>x.ref===c.id&&x.kind===which);
  if(t){ t.done=true; t.doneAt=new Date().toISOString(); t.by=db.meta.encoder; t.result=result; }
  if(result==='reheat'){ markReheat(c, date+'T07:00'); return; }
  if(which==='RH3'&&result==='clear') c.status='PREGNANT';
  save(); toast('Check recorded. '+(c.status==='PREGNANT'?'Pregnancy confirmed.':'No reheat yet — keep watching.')); render();
}

/* 4) REHEAT — close the cycle, open a fresh one at once. No duplicates. */
function markReheat(c, heatAt){
  if(!OPEN.includes(c.status)){ toast('This record is already closed ('+c.status+'). Nothing was duplicated.'); render(); return; }
  c.status='REHEAT'; c.closedAt=new Date().toISOString(); c.reheatAt=heatAt; c.closedBy=db.meta.encoder;
  dropTasks(t=>t.ref===c.id);                     // drop every pending watch task from the old cycle
  const s=sowOf(c.sowId);
  const nc={id:uid('c'),sowId:c.sowId,heatAt,status:'HEAT',fromReheat:c.id,note:'Reheat after A.I. '+fdate(c.aiAt),
            by:db.meta.encoder,parityAt:s?s.parity:0,createdAt:new Date().toISOString(),ais:[],checks:[]};
  db.cycles.push(nc); refreshHeatTasks(nc); save();
  const w=aiWindow(heatAt);
  toast('Reheat recorded. New breeding window: '+fshort(w.from)+' '+ftime(w.from)+'–'+ftime(w.to));
  render();
}

/* 5) Farrowing */
function recordFarrow(cycleId, d){
  const c=cycleOf(cycleId); if(!c) return;
  if(db.farrowings.some(f=>f.cycleId===cycleId)){ toast('Farrowing is already recorded for this cycle.'); return; }
  const s=sowOf(c.sowId);
  const f={id:uid('f'),cycleId,sowId:c.sowId,date:d.date,
    alive:num(d.alive),still:num(d.still),mumi:num(d.mumi),weak:num(d.weak),
    crushed:0,weanPlan:addD(d.date,LACT),weanDate:null,weaned:null,note:d.note||'',by:db.meta.encoder,
    boarId:c.boarId,gest:dDiff(todayISO(c.aiAt),d.date)};
  db.farrowings.push(f);
  c.status='FARROWED'; c.closedAt=new Date().toISOString(); c.farrowId=f.id;
  dropTasks(t=>t.ref===c.id);
  if(s){ s.parity=(s.parity||0)+1; s.lastFarrow=d.date; }
  buildLitterTasks(f); save(); toast('Farrowed: '+(s?s.tag:'')+' — '+f.alive+' born alive. Weaning: '+fdate(f.weanPlan)); render();
}
function buildLitterTasks(f){
  const tag=tagOf(f.sowId), r=f.id, d0=f.date;
  const T=(kind,day,title,detail,group)=>addTask({kind,ref:r,sowId:f.sowId,date:addD(d0,day),title,detail,group:group||'baktin',day});
  T('P3',3,'D3 piglets of '+tag,'Iron 1mL, antibiotic for wounds, teeth clip, ear notch, tail dock');
  T('P7',7,'D7 piglets of '+tag,'Inject multivitamins. Start Foster Milk + Baby 7 + Scourex (until D15)');
  T('P15',15,'D15 piglets of '+tag,'2nd Iron 1mL each. Continue Baby 7 until D21');
  T('P21',21,'D21 — WEAN the litter of '+tag,'Vit ADE for the piglets (anti-stress) + Vit ADE 10mL for the sow. Move them to the nursery.');
  T('SDW',24,'Deworm '+tag,'3 days after weaning/ADE','sow');
  T('SHW',26,'Watch for heat: '+tag,'D5–D7 after weaning — the moment you see heat, log the TIME','sow');
}

/* 6) Wean */
function recordWean(farrowId, date, weaned, crushed, note){
  const f=db.farrowings.find(x=>x.id===farrowId); if(!f) return;
  if(f.weanDate){ toast('This litter is already weaned.'); return; }
  f.weanDate=date; f.weaned=num(weaned); f.crushed=num(crushed); f.weanNote=note||'';
  db.tasks.filter(t=>t.ref===f.id&&['P21'].includes(t.kind)).forEach(t=>{t.done=true;t.doneAt=new Date().toISOString();});
  // re-anchor the sow tasks to the actual weaning date
  dropTasks(t=>t.ref===f.id&&['SDW','SHW'].includes(t.kind));
  const tag=tagOf(f.sowId);
  addTask({kind:'SDW',ref:f.id,sowId:f.sowId,date:addD(date,3),group:'sow',title:'Deworm '+tag,detail:'3 days after Vit ADE'});
  addTask({kind:'SHW',ref:f.id,sowId:f.sowId,date:addD(date,5),group:'sow',title:'Watch for heat: '+tag,detail:'D5–D7 after weaning ('+fshort(addD(date,5))+'–'+fshort(addD(date,7))+'). Log the exact time you saw it.'});
  const b={id:uid('n'),farrowId:f.id,sowTag:tag,inDate:date,heads:num(weaned),out:0,dead:0,
    note:'', by:db.meta.encoder, status:'open'};
  db.nursery.push(b);
  addTask({kind:'NUR',ref:b.id,date:addD(date,7),group:'baktin',title:'Nursery '+tag+': 7 days of Scourex done',
    detail:'Continue Baby 7 + Foster Milk. Check for scours and weight.'});
  save(); toast(weaned+' piglets weaned. They are in the nursery now.'); render();
}

/* ---- form builder ---- */
let MODAL=null;
function field(f){
  const v=f.val==null?'':f.val;
  let inp;
  const ev=f.on?` onchange="${f.on}"`:'';
  if(f.type==='select') inp=`<select id="f_${f.k}"${ev}>${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;
  else if(f.type==='textarea') inp=`<textarea id="f_${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else inp=`<input id="f_${f.k}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${ev}
      ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.min!=null?'min="'+f.min+'"':''}>`;
  return `<div class="field"><label for="f_${f.k}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function modal(title, sub, fields, okLabel, onOk, extraHTML){
  MODAL={fields,onOk};
  $('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">
    <h2>${esc(title)}</h2><div class="sub">${sub||''}</div>
    ${extraHTML||''}
    ${fields.map(field).join('')}
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="submitModal()">${esc(okLabel||'Save')}</button></div></div></div>`;
  const first=$('f_'+fields[0].k); if(first&&window.innerWidth>880) first.focus();
}
function closeModal(){ MODAL=null; $('modalHost').innerHTML=''; }
function submitModal(){
  if(!MODAL) return;
  const o={};
  for(const f of MODAL.fields){
    const e=$('f_'+f.k); let v=e?e.value:'';
    if(f.type==='number') v=v===''?'':num(v);
    if(f.req&&(v===''||v==null)){ toast('Kulang: '+f.label); e&&e.focus(); return; }
    o[f.k]=v;
  }
  const fn=MODAL.onOk; closeModal(); fn(o);
}
function confirmBox(msg, onYes){
  $('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Are you sure?</h2><div class="sub">${esc(msg)}</div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">No</button>
    <button class="btn danger" id="yesBtn">Yes, go ahead</button></div></div></div>`;
  $('yesBtn').onclick=()=>{ closeModal(); onYes(); };
}
function setEncoder(){
  modal('Who is entering records?','This gets stamped on everything you record.',
    [{k:'n',label:'Name',val:db.meta.encoder,req:true,ph:'e.g. Nonoy / Tatay / Boss'},

let LINES=[], LINECFG={};
function itemsOf(kind){ return (db.items||[]).filter(x=>x.kind===kind)
  .sort((a,b)=>a.name.localeCompare(b.name)); }
function itemKg(name){
  const it=itemsOf('feed').find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());
  return it&&num(it.kg)?num(it.kg):50;
}
function priceOf(kind,name){
  const it=itemsOf(kind).find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());
  return it?it.price:null;
}
function lineName(el){
  const row=el.parentElement&&el.parentElement.parentElement;
  const pr=row?row.querySelector('.l-price'):null;
  const p=priceOf(LINECFG.kind, el.value);
  if(pr&&p!=null&&!String(pr.value).trim()) pr.value=p;
  lineCalc();
}
function lineEditor(cfg){
  LINECFG=Object.assign({list:'sugg',opts:[],qty:'Qty',price:'Unit price',name:'Item',kind:''},cfg);
  if(LINECFG.kind){ const names=itemsOf(LINECFG.kind).map(x=>x.name);
    if(names.length) LINECFG.opts=names; }
  if(!LINES.length) LINES=[{name:'',qty:1,price:''}];
  return `<datalist id="${LINECFG.list}">${(LINECFG.opts||[]).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
    <div class="field"><label>${esc(LINECFG.title||'Items')}</label>
    <div id="lines">${linesHTML()}</div>
    <button class="btn ghost sm" onclick="lineAdd()">+ Add another item</button>
    <div class="ltotal"><span>Total</span><b id="lineTotal">${peso(lineSum())}</b></div></div>`;
}
function linesHTML(){
  return LINES.map((r,i)=>`<div class="lrow">
    <div class="top">
      <input class="l-name" list="${LINECFG.list}" value="${esc(r.name||'')}"
        placeholder="${esc(LINECFG.name)}" autocapitalize="words" oninput="lineName(this)">
      ${LINES.length>1?`<button onclick="lineDel(${i})" title="remove">\u00d7</button>`:''}
    </div>
    <div class="bot">
      <div><span class="lcap">${esc(LINECFG.qty)}</span>
        <input class="l-qty" type="number" inputmode="decimal" step="any" value="${r.qty==null?'':esc(r.qty)}" oninput="lineCalc()"></div>
      <div><span class="lcap">${esc(LINECFG.price)}</span>
        <input class="l-price" type="number" inputmode="decimal" step="any" value="${r.price==null?'':esc(r.price)}" oninput="lineCalc()"></div>
      <div><span class="lcap">Amount</span><div class="amt" data-amt="${i}">${peso(num(r.qty)*num(r.price))}</div></div>
    </div></div>`).join('');
}
function lineRead(){
  const rows=document.querySelectorAll('#lines .lrow');
  if(!rows.length) return LINES;
  LINES=[...rows].map(el=>({
    name:(el.querySelector('.l-name')||{}).value||'',
    qty:(el.querySelector('.l-qty')||{}).value||'',
    price:(el.querySelector('.l-price')||{}).value||''}));
  return LINES;
}
function lineSum(){ return LINES.reduce((a,r)=>a+num(r.qty)*num(r.price),0); }
function lineCalc(){
  lineRead();
  LINES.forEach((r,i)=>{ const e=document.querySelector(`[data-amt="${i}"]`);
    if(e) e.textContent=peso(num(r.qty)*num(r.price)); });
  const t=$('lineTotal'); if(t) t.textContent=peso(lineSum());
}
function lineAdd(){ lineRead(); LINES.push({name:'',qty:1,price:''}); lineRedraw(); }
function lineDel(i){ lineRead(); LINES.splice(i,1); if(!LINES.length) LINES=[{name:'',qty:1,price:''}]; lineRedraw(); }
function lineRedraw(){ const box=$('lines'); if(box){ box.innerHTML=linesHTML(); lineCalc(); } }
function goodLines(){ return lineRead().filter(r=>String(r.name).trim()&&(num(r.qty)||num(r.price))); }

function pendingTasks(){

}
function taskLine(t){
  const n=fromToday(t.date);

function tickClocks(){
  document.querySelectorAll('[data-heat]').forEach(el=>{
    const st=aiState(el.dataset.heat);

                   : st.s==='open'? hhmm(st.ms)+' na lang'

}

const SOWFILTERS=[['tanan','All'],['heat','In heat'],['bred','Bred'],['preg','Pregnant'],
                  ['lact','Lactating'],['open','Open'],['gilt','Gilts']];
function matchFilter(s){
  const k=sowState(s).k;
  if(FILTER==='tanan') return s.status!=='CULL';
  if(FILTER==='heat') return k==='HEAT';
  if(FILTER==='bred') return k==='BRED';
  if(FILTER==='preg') return k==='PREG';
  if(FILTER==='lact') return k==='LACT';
  if(FILTER==='open') return k==='OPEN';
  if(FILTER==='gilt') return k==='GILT'||k==='GILTOK';
  return true;
}
function setFilter(f){ FILTER=f; const box=$('qbox'); if(box) Q=box.value;
  const list=$('sowList');
  if(list){ document.querySelectorAll('.chipbar button').forEach(b=>b.classList.toggle('on',b.textContent===(SOWFILTERS.find(x=>x[0]===f)||[])[1]));
    list.innerHTML=sowRows(); } else render(); }
function filterSows(){                       // only the list is redrawn, never the box you are typing in
  const box=$('qbox'); if(box) Q=box.value;
  const list=$('sowList'); if(list) list.innerHTML=sowRows();
}

function sowRows(){
  let list=db.sows.filter(matchFilter);

  list.sort((a,b)=>a.tag.localeCompare(b.tag,undefined,{numeric:true}));
  if(!list.length) return `<div class="card"><div class="empty"><b>Nothing found</b>Change the filter or the search.</div></div>`;
  return list.map(s=>{const st=sowState(s);
    return `<button class="listitem" onclick="go('sow','${s.id}')">${tagChip(s.tag)}
      <div class="meta"><div class="l1">${st.label}</div>

      <div class="bar"><i style="width:${Math.min(100,Math.round(dDiff(c.aiAt,todayISO())/GEST*100))}%"></i></div>

      <div class="row wrap" style="margin-top:10px">
        <button class="btn sm danger" onclick="askReheat('${c.id}')">She REHEATED</button>
        <button class="btn ghost sm" onclick="askCheck('${c.id}')">Record a check</button>
        <button class="btn sm" onclick="askFarrow('${s.id}')">She farrowed</button>
        <button class="btn danger sm" onclick="delCycle('${c.id}')">Delete this record</button></div></div>`;
  }
  if(!c&&!f){
    const ok=st.k!=='GILT';
    h+=`<div class="card"><div class="spread"><div><b>${ok?'Waiting for heat':'Still too young'}</b>
      <div class="small muted">${ok?'The moment you see her in heat, log the time — the 28–32 hours are counted from there.':(st.sub||'7 months is the minimum age before A.I.')}</div></div></div>
      <div style="margin-top:10px"><button class="btn wide" onclick="askHeat('${s.id}')">Seen in heat</button></div></div>`;
  }

  /* --- history --- */
  const cy=sowCycles(s.id);
  if(cy.length){
    h+=`<div class="sect-head"><h2>History</h2><span class="count">${cy.length} cycles</span></div><div class="card tight">`;
    h+=cy.map(c2=>{
      const far=db.farrowings.find(x=>x.cycleId===c2.id);
      const badge=c2.status==='REHEAT'?'<span class="pill r">Reheat</span>'
        :c2.status==='FARROWED'?'<span class="pill g">Farrowed</span>'
        :'<span class="pill w">'+c2.status+'</span>';
      return `<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
        <div class="spread"><b class="small">${fdate(c2.heatAt)}</b>${badge}</div>
        <div class="tiny muted">Heat ${ftime(c2.heatAt)}${c2.aiAt?' · A.I. '+fshort(c2.aiAt)+' '+ftime(c2.aiAt):' · no A.I.'}
        ${c2.boarId&&boarOf(c2.boarId)?' · boar '+esc(boarOf(c2.boarId).tag):''}
        ${far?' · '+far.alive+' live, '+far.still+' stillborn, '+far.mumi+' mummified'+(far.weaned!=null?', '+far.weaned+' weaned':''):''}</div>
        ${far?`<button class="link tiny" onclick="go('litter','${far.id}')">View the litter</button>`:''}</div>`;
    }).join('');
    h+=`</div>`;
  }
  if(can('sowedit')) h+=`<div class="card"><button class="btn danger sm wide" style="margin-bottom:8px" onclick="askCull('${s.id}')">
    ${s.status==='CULL'?'Return to active':'Cull / mark as sold'}</button>
    <button class="btn danger sm wide" onclick="delSow('${s.id}')">Delete this sow and all her records</button>
    <div class="tiny muted" style="margin-top:6px">Cull keeps her history. Delete is for a sow entered twice by mistake.</div></div>`;
  return h;
}

function pregTimeline(c){
  const d0=todayISO(c.aiAt), n=dDiff(d0,todayISO());
  const nd=(c.ais||[]).length;
  const pts=[[0, nd>1?'A.I. — '+(ORD[nd-1]||nd+'th')+' dose':'A.I.',
    fdate(c.aiAt)+' '+ftime(c.aiAt)+(nd>1?' · 1st dose was '+fshort(c.aiFirst)+' '+ftime(c.aiFirst):'')],
    [18,'Reheat check D18–21',fshort(addD(d0,18))+'–'+fshort(addD(d0,21))],
    [40,'Check D40',fshort(addD(d0,40))],
    [60,'D60 — confirm',fshort(addD(d0,60))],
    [107,'Prepare the pen',fshort(addD(d0,107))],
    [114,'Farrowing',fdate(addD(d0,114))]];
  return `<div class="tl">`+pts.map(([d,t,s])=>{
    const ck=(c.checks||[]).find(x=>(x.which==='RH1'&&d===18)||(x.which==='RH2'&&d===40)||(x.which==='RH3'&&d===60));
    const passed=n>=d, cur=!passed&&n>=d-3;
    return `<div class="n ${ck?'ok':passed?'ok':cur?'now':''}"><div class="t">${t}</div>
      <div class="s">${s}${ck?' · <b style="color:var(--good)">checked: no reheat</b>':passed&&d>0&&d<=60?' · not checked yet':''}</div></div>`;
  }).join('')+`</div>`;
}
function litterTimeline(f){
  const ts=db.tasks.filter(t=>t.ref===f.id&&t.kind.startsWith('P')).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ts.length) return '';
  return `<div class="tl">`+ts.map(t=>{
    const n=fromToday(t.date);
    return `<div class="n ${t.done?'ok':n===0?'now':''}"><div class="t">${esc(t.title.split(' of ')[0])} · ${fshort(t.date)}</div>
      <div class="s">${esc(t.detail)}${t.done?' · <b style="color:var(--good)">done</b>':n<0?' · <b style="color:var(--alert)">overdue</b>':''}</div></div>`;
  }).join('')+`</div>`;
}

function askAI(cycleId){
  const c=cycleOf(cycleId); if(!c) return;
  const n=(c.ais||[]).length;
  const w=aiWindow(c.heatAt), st=aiState(c.heatAt);
  if(n){
    const prev=c.ais[n-1];
    const gapNote=`<div class="card tight"><b class="small">${ORD[n]||(n+1)+'th'} dose</b>
      <div class="tiny">Last dose was ${fshort(prev.at)} ${ftime(prev.at)}. A second dose is usually given
      12–24 hours after the first, which lands around ${fshort(new Date(new Date(prev.at).getTime()+18*HR).toISOString())}
      ${ftime(new Date(new Date(prev.at).getTime()+18*HR).toISOString())}.
      Once you save, the D18–21, D40, D60 checks and the 114 days are worked out again from this newest dose.</div></div>`;
    modal('Another dose for '+tagOf(c.sowId),'For a sow slow to release, so the service covers the whole window.',[
      {k:'at',label:'Date and time of this dose',type:'datetime-local',req:true,val:nowLocal()},
      boarPicker('boarId'),
      {k:'tech',label:'Who did the A.I.',val:who()},
      {k:'note',label:'Notes (dose, semen, reflex)',val:''}
    ],'Record the dose',o=>recordAI(cycleId,o.at,o.boarId,o.tech,o.note),gapNote);
    const e=$('f_boarId'); if(e) e.value=prev.boarId||'';
    return;
  }
  const sw=sowOf(c.sowId), ad=ageDays(sw&&sw.birth);
  const young=(ad!=null&&ad<210&&!(sw.parity))?`<div class="card tight" style="background:var(--alert-bg);border-color:#EDC6BC">
     <b class="small">This gilt is still young.</b><div class="tiny">She is ${Math.ceil(210-ad)} days short of 7 months. Better to skip this heat if you can.</div></div>`:'';
  const warn=st.s==='soon'?`<div class="card tight" style="background:var(--warn-bg);border-color:#EDD9AC">
     <b class="small">Too early.</b><div class="tiny">By your own program there are still ${hhmm(st.ms)} before the 28-hour mark (${ftime(w.from)}).</div></div>`
   :st.s==='late'?`<div class="card tight" style="background:var(--alert-bg);border-color:#EDC6BC">
     <b class="small">The window has passed.</b><div class="tiny">The 32 hours ended at ${ftime(w.to)}. Record it anyway if you bred her — just say so in the notes.</div></div>`:'';
  modal('A.I. done on '+tagOf(c.sowId),'Window: '+fshort(w.from)+' '+ftime(w.from)+' – '+ftime(w.to),[
    {k:'at',label:'Date and time of the A.I.',type:'datetime-local',req:true,val:nowLocal()},
    boarPicker('boarId'),
    {k:'tech',label:'Who did the A.I.',val:db.meta.encoder},
    {k:'note',label:'Notes (dose, semen, reflex)',val:''}
  ],'Record',o=>recordAI(cycleId,o.at,o.boarId,o.tech,o.note),young+warn);
}

  let n=0;

function dl(name,text,type){
  const b=new Blob([text],{type:type||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},900);
}
function exportJSON(){ dl('piggery-backup-'+todayISO()+'.json', JSON.stringify(db,null,1)); toast('Backup downloaded.'); }
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.sows) throw 0;
      confirmBox('Replace all data on this device?',()=>{ db=Object.assign(blank(),d); save(); go('dash'); toast('Imported.'); });
    }catch(e){ toast('That file could not be read.'); } };
  r.readAsText(f);
}
function csv(rows){ return rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'); }
function csvSows(){

function csvBreed(){
  const rows=[['Eartag','Heat','A.I.','Boar','Status','Due','Farrowed','Live','Stillborn','Mummified','Crushed','Weaned']];
  db.cycles.forEach(c=>{ const f=db.farrowings.find(x=>x.cycleId===c.id);

      c.status,c.dueDate||'',f?f.date:'',f?f.alive:'',f?f.still:'',f?f.mumi:'',f?(f.crushed||0):'',f&&f.weaned!=null?f.weaned:'']); });
  dl('breeding-'+todayISO()+'.csv',csv(rows),'text/csv'); }
function csvMoney(){
  const rows=[['Date','Type','Details','Amount']];
  db.feeds.forEach(x=>rows.push([x.date,'Feeds',x.feed+' · '+refLabel(x.ref)+' · '+x.bags+' bags',num(x.total)]));

function countWork(name){
  let n=0;
  db.cycles.forEach(c=>{ if(c.by===name) n++; (c.ais||[]).forEach(a=>{ if(a.by===name) n++; });
    (c.checks||[]).forEach(x=>{ if(x.by===name) n++; }); });
  [db.farrowings,db.feeds,db.expenses,db.sales,db.health,db.flogs,db.payroll].forEach(arr=>
    arr.forEach(x=>{ if(x.by===name) n++; }));
  db.tasks.forEach(t=>{ if(t.done&&t.by===name) n++; });
  return n;
}

const CASEKIND=[['sow','Sow'],['fattening','Fattening'],['nursery','Nursery']];
function caseOptions(kind){
  if(kind==='sow'){
    const out=[];
    db.sows.filter(x=>x.status!=='CULL')
      .sort((a,b)=>a.tag.localeCompare(b.tag,undefined,{numeric:true}))
      .forEach(x=>{
        out.push([x.id, x.tag+' \u00b7 '+sowState(x).label]);
        const f=openFarrow(x.id);
        if(f) out.push(['lit:'+f.id, x.tag+' \u00b7 piglets on the sow \u00b7 D'+dDiff(f.date,todayISO())
          +' \u00b7 '+(f.alive-(f.crushed||0))+' head']);
      });
    return out;
  }
  if(kind==='fattening') return db.fatten.filter(b=>b.status==='open')
    .map(b=>[b.id,b.code+' \u00b7 '+batchOn(b)+' head']);
  if(kind==='nursery') return db.nursery.filter(b=>b.status==='open')
    .map(b=>[b.id,b.sowTag+' \u00b7 '+(b.heads-b.out-b.dead)+' head \u00b7 in '+fshort(b.inDate)]);
  return [];
}
function fillCaseTargets(){
  const k=$('f_kind').value, sel=$('f_ref'); if(!sel) return;
  const list=caseOptions(k);
  sel.innerHTML = list.length
    ? list.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')
    : `<option value="">no open records under ${esc((CASEKIND.find(x=>x[0]===k)||['',''])[1])}</option>`;
}
function caseTag(kind, ref){
  if(String(ref).startsWith('lit:')){
    const f=db.farrowings.find(x=>x.id===String(ref).slice(4));
    return f?'Piglets of '+tagOf(f.sowId):'';
  }
  if(kind==='sow'){ const x=sowOf(ref); return x?'Sow '+x.tag:''; }
  if(kind==='fattening'){ const b=db.fatten.find(x=>x.id===ref); return b?'Fattening '+b.code:''; }
  if(kind==='nursery'){ const b=db.nursery.find(x=>x.id===ref); return b?'Nursery '+b.sowTag:''; }
  return '';
}

    addTask({kind:'HLT2',ref:c.id,date:addD(o.date,num(o.days)||1),group:'health',title:'Last day of treatment \u2014 '+tag,

function askCaseNote(id){

function askCaseClose(id){

    {k:'status',label:'Outcome',type:'select',req:true,
      opts:[['recovered','Recovered'],['watch','Still watching'],['died','Died'],['culled','Culled / sold off']]},
    {k:'date',label:'Date',type:'date',req:true,val:todayISO()},
    {k:'note',label:'Notes',val:''}
  ],'Save',o=>{
    c.status=o.status; c.closedAt=o.date; c.closeNote=o.note; c.closedBy=who();
    (c.logs=c.logs||[]).push({date:o.date,note:(HSTATUS[o.status]||['closed'])[0]+(o.note?' \u2014 '+o.note:''),by:who()});
    if(o.status!=='watch') dropTasks(t=>t.ref===c.id&&t.kind!=='WDL');
    if(o.status==='died'){
      if(c.kind==='fattening'){ const b=db.fatten.find(x=>x.id===c.ref); if(b) b.dead=(b.dead||0)+(c.heads||1); }
      if(c.kind==='nursery'){ const b=db.nursery.find(x=>x.id===c.ref); if(b){ b.dead=(b.dead||0)+(c.heads||1);
        (b.deaths=b.deaths||[]).push({id:uid('d'),date:o.date,n:(c.heads||1),why:c.diagnosis||'Sick',by:who()}); } }
      if(c.kind==='piglet'){ const f=db.farrowings.find(x=>x.id===c.ref);
        if(f){ const n=Math.min(c.heads||1, f.alive-(f.crushed||0));
          f.crushed=(f.crushed||0)+n;
          (f.deaths=f.deaths||[]).push({id:uid('d'),date:o.date,n,why:c.diagnosis||'Sick',
            note:'from the health record',by:who(),day:dDiff(f.date,o.date)}); } }
    }
    save(); toast('Case closed.'); go('health');
  });
}

/* ============================================================
   VIEW: OPERATIONS REVIEW (admin / manager)
   ============================================================ */
function vReview(){
  if(!can('review')) return vDash();
  const cyc=db.cycles.filter(c=>c.aiAt);
  let onTime=0, late=0;
  cyc.forEach(c=>{ const w=aiWindow(c.heatAt), t=new Date(c.aiAt).getTime();
    if(t>=new Date(w.from).getTime()-30*60000 && t<=new Date(w.to).getTime()+30*60000) onTime++; else late++; });
  const closed=db.cycles.filter(c=>['REHEAT','FARROWED'].includes(c.status)&&c.aiAt);
  const farrowed=closed.filter(c=>c.status==='FARROWED').length;
  const rate=closed.length?Math.round(farrowed/closed.length*100):null;
  const fs=db.farrowings;
  const born=fs.reduce((a,f)=>a+f.alive+f.still+f.mumi,0), alive=fs.reduce((a,f)=>a+f.alive,0);
  const crushed=fs.reduce((a,f)=>a+(f.crushed||0),0);
  const byWhy={};
  fs.forEach(f=>(f.deaths||[]).forEach(x=>{ byWhy[x.why||'Not known']=(byWhy[x.why||'Not known']||0)+x.n; }));
  const early=fs.reduce((a,f)=>a+(f.deaths||[]).filter(x=>x.day!=null&&x.day<=3).reduce((b,x)=>b+x.n,0),0);
  const preWean=alive?Math.round(crushed/alive*1000)/10:0;
  const overdue=db.tasks.filter(t=>!t.done&&fromToday(t.date)<0);
  const pct=n=>n==null?'\u2014':n+'%';
  let h=`<button class="backlink" onclick="go('more')">\u2039 More</button><h1>Operations review</h1>
  <div class="small muted" style="margin-bottom:10px">Everything below is worked out from what your people entered.</div>
  <div class="grid3" style="margin-bottom:9px">
    <div class="stat"><b class="num">${pct(cyc.length?Math.round(onTime/cyc.length*100):null)}</b><span>A.I. inside the 28\u201332h window</span></div>
    <div class="stat"><b class="num">${pct(rate)}</b><span>Farrowing rate</span></div>
    <div class="stat"><b class="num">${fs.length?Math.round(alive/fs.length*10)/10:'\u2014'}</b><span>Born alive per litter</span></div>
    <div class="stat"><b class="num">${fs.length?Math.round(born/fs.length*10)/10:'\u2014'}</b><span>Total born per litter</span></div>
    <div class="stat"><b class="num">${preWean}%</b><span>Pre-weaning losses</span></div>
    <div class="stat"><b class="num">${overdue.length}</b><span>Overdue tasks</span></div>
  </div>`;

  // what to improve
  const tips=[];
  if(cyc.length>=3&&onTime/cyc.length<0.8) tips.push(['A.I. timing is slipping',
    late+' of '+cyc.length+' services were outside the 28\u201332 hour window. Every hour off costs you piglets. Ask the technician to log the heat time the moment it is seen.']);
  if(rate!=null&&closed.length>=4&&rate<80) tips.push(['Farrowing rate below 80%',
    'Look at semen handling, the age of the dose, and whether sows are bred twice. Check the boar used in the failed services.']);
  if(preWean>12) tips.push(['Pre-weaning losses are high',
    preWean+'% of live-born piglets are lost before weaning. Most of it is crushing in the first three days \u2014 check the creep heat, the farrowing crates, and night supervision.']);
  if(overdue.length>4) tips.push(['Work is piling up',
    overdue.length+' tasks are past their date. Injections and checks on a fixed day do not wait. Go through them with the person responsible.']);
  const skipped=db.cycles.filter(c=>c.status==='HEAT'&&aiState(c.heatAt).s==='late'&&fromToday(todayISO(c.heatAt))<-2).length;
  if(skipped) tips.push(['Heats recorded but never bred',
    skipped+' sow(s) were seen in heat and no A.I. was ever recorded. Each missed heat is 21 empty days.']);
  const noDate=db.sows.filter(x=>!x.birth&&x.status!=='CULL').length;
  if(noDate) tips.push(['Missing birth dates',noDate+' sow(s) have no birth date, so the 7-month gilt rule cannot be checked for them.']);
  const whys=Object.entries(byWhy).sort((a,b)=>b[1]-a[1]);
  if(whys.length) h+=`<div class="sect-head"><h2>Why piglets are lost</h2></div><div class="card tight">
    <table class="tbl"><tr><th>Reason</th><th class="n">Head</th><th class="n">Share</th></tr>
    ${whys.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td>
      <td class="n">${crushed?Math.round(v/crushed*100):0}%</td></tr>`).join('')}</table>
    ${early?`<div class="tiny muted" style="margin-top:6px">${early} of them died in the first three days.</div>`:''}</div>`;
  h+=`<div class="sect-head"><h2>What to improve</h2></div>`;
  h+= tips.length? tips.map(([t,d])=>`<div class="card tight" style="border-left:3px solid var(--alert)">
      <b class="small">${t}</b><div class="small muted">${d}</div></div>`).join('')
    : `<div class="card"><div class="empty"><b>Nothing standing out.</b>Timing, farrowing rate and losses are all inside normal range.</div></div>`;

  // per person
  h+=`<div class="sect-head"><h2>Your people</h2></div><div class="card tight scrollx"><table class="tbl">
    <tr><th>Name</th><th>Role</th><th class="n">Records</th><th class="n">Done</th><th class="n">Overdue</th></tr>`;
  h+=db.users.map(u=>{
    const g=ROLE[u.role].groups;
    const mine=t=>g==='*'||g===''||(Array.isArray(g)&&g.includes(t.group||'sow'));
    const od=overdue.filter(mine).length;
    const done=db.tasks.filter(t=>t.done&&t.by===u.name).length;
    return `<tr><td>${esc(u.name)}${u.active===false?' <span class="pill n">off</span>':''}</td>
      <td>${ROLE[u.role].label.split(' ')[0]}</td><td class="n">${countWork(u.name)}</td>
      <td class="n">${done}</td><td class="n">${ROLE[u.role].groups===''?'\u2014':od}</td></tr>`;}).join('');
  h+=`</table><div class="tiny muted" style="margin-top:6px">Overdue is counted for the whole area a person covers, not blame for one person.</div></div>`;

  // overdue detail
  if(overdue.length){
    h+=`<div class="sect-head"><h2>Past their date</h2></div><div class="card">
      ${overdue.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12).map(t=>
        `<div class="task late"><div class="when">${whenTxt(t.date)}<br><span style="font-weight:500;color:#8B9A89">${fshort(t.date)}</span></div>
        <div class="body"><div class="t">${esc(t.title)}</div><div class="d">${esc(t.detail||'')}</div></div></div>`).join('')}</div>`;
  }
  // money per pig
  if(can('money')){
    const feedCost=db.feeds.reduce((a,x)=>a+num(x.total),0);
    const sold=db.sales.reduce((a,x)=>a+num(x.heads||0),0);
    const income=db.sales.reduce((a,x)=>a+num(x.amount),0);
    const spend=feedCost+db.expenses.reduce((a,x)=>a+num(x.amount),0)+db.payroll.reduce((a,x)=>a+num(x.net),0);
    h+=`<div class="sect-head"><h2>Money, all time</h2></div><div class="card">
      <div class="spread small"><span class="muted">Total spent</span><b class="money">${peso(spend)}</b></div>
      <div class="spread small"><span class="muted">Total sales</span><b class="money">${peso(income)}</b></div>
      <div class="spread small"><span class="muted">Feed share of spending</span><b>${spend?Math.round(feedCost/spend*100):0}%</b></div>
      <div class="spread small"><span class="muted">Sold</span><b>${sold} head</b></div>
      <hr class="sep"><div class="spread"><b>Balance</b>
      <b class="money" style="color:${income-spend>=0?'var(--good)':'var(--alert)'}">${peso(income-spend)}</b></div></div>`;
  }
  // sign-in history
  const li=db.logins.slice(-8).reverse();
  if(li.length) h+=`<div class="sect-head"><h2>Recent sign-ins</h2></div><div class="card tight">
    ${li.map(l=>`<div class="spread small" style="padding:5px 0"><span>${esc(l.user)}${l.note?' <span class="pill w">'+esc(l.note)+'</span>':''}</span>
    <span class="muted tiny">${fshort(l.at)} ${ftime(l.at)}</span></div>`).join('')}</div>`;
  return h;
}

/* ============================================================
   FINGERPRINT SIGN-IN
   Uses the phone's own fingerprint reader. What is stored here is
   only a marker saying "this finger belongs to this account on
   this phone" \u2014 the fingerprint itself never leaves the phone and
   the app never sees it.
   ============================================================ */
const BKEY='piggery_bio';
function bioSupported(){
  try{ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create
    && (location.protocol==='https:'||location.hostname==='localhost')); }catch(e){ return false; }
}
function bioList(){ try{ return JSON.parse(localStorage.getItem(BKEY)||'[]'); }catch(e){ return []; } }
function bioStore(l){ try{ localStorage.setItem(BKEY,JSON.stringify(l)); }catch(e){} }
function bioOn(userId){ return bioList().some(x=>x.userId===userId); }
function b64u(buf){ const b=new Uint8Array(buf); let str='';
  for(let i=0;i<b.length;i++) str+=String.fromCharCode(b[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(t){ const bin=atob(String(t).replace(/-/g,'+').replace(/_/g,'/'));
  const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function bioEnroll(){
  if(!SESSION) return;
  if(!bioSupported()) return toast('This phone cannot do fingerprint sign-in.');
  const u=userOf(SESSION.id); if(!u) return;
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:rnd(32),
      rp:{name:db.meta.farm||'Piggery Record'},
      user:{id:rnd(16), name:u.username||u.name, displayName:u.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000, attestation:'none'}});
    if(!cred) return toast('Nothing was set up.');
    const l=bioList().filter(x=>x.userId!==u.id);
    l.push({credId:b64u(cred.rawId), userId:u.id, name:u.name, at:new Date().toISOString()});
    bioStore(l);
    toast('Fingerprint is on for this phone.');
  }catch(e){ toast('Fingerprint was not set up. '+(e&&(e.message||e.name)||'')); }
}
async function bioSignIn(credId){
  const e0=bioList().find(x=>x.credId===credId); if(!e0) return;
  const u=userOf(e0.userId);
  if(!u||u.active===false){ bioStore(bioList().filter(x=>x.credId!==credId));
    render(); return toast('That account is no longer on this farm.'); }
  try{
    const got=await navigator.credentials.get({publicKey:{
      challenge:rnd(32), allowCredentials:[{type:'public-key', id:unb64u(credId)}],
      userVerification:'required', timeout:60000}});
    if(!got) return;
    signIn(u);
  }catch(e){ toast('Not recognised. Use your password instead.'); }
}
function bioForget(){
  if(!SESSION) return;
  bioStore(bioList().filter(x=>x.userId!==SESSION.id));
  toast('Fingerprint turned off on this phone.');
}
/* ============================================================
   CLOUD SYNC (Supabase REST \u2014 no extra library needed)
   Every device keeps its own copy and works offline. When there
   is signal, the copies are merged so nobody loses an entry.
   ============================================================ */
const CKEY='piggery_cloud';
const SYNCABLE=['users','health','logins','collections','items','sows','boars','cycles','farrowings','tasks',
  'nursery','fatten','flogs','feeds','expenses','workers','payroll','sales','notes'];
let CLOUD=null, SYNC={s:'off',msg:'Not connected',at:null}, syncTimer=null, syncing=false;

function loadCloud(){ try{ const r=localStorage.getItem(CKEY); if(r) CLOUD=JSON.parse(r); }catch(e){} }
function storeCloud(){ try{ CLOUD?localStorage.setItem(CKEY,JSON.stringify(CLOUD)):localStorage.removeItem(CKEY); }catch(e){} }
function cloudOn(){ return !!(CLOUD&&CLOUD.url&&CLOUD.key&&CLOUD.farm); }
function syncChip(){
  const b=$('syncBtn'); if(!b) return;
  b.className='synced'+(SYNC.s==='ok'?' ok':SYNC.s==='bad'?' bad':(SYNC.s==='busy'||SYNC.s==='wait')?' busy':'');
  b.textContent = SYNC.s==='ok'?'\u25cf':SYNC.s==='busy'?'\u25cc':SYNC.s==='wait'?'\u2191':SYNC.s==='bad'?'!':'\u25cb';
  b.title = SYNC.msg;
}
function setSync(st,msg){ SYNC.s=st; SYNC.msg=msg; if(st==='ok') SYNC.at=new Date().toISOString(); syncChip(); }
async function api(path,opts){
  const base=CLOUD.url.replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/'+path, Object.assign({
    headers:{apikey:CLOUD.key, Authorization:'Bearer '+CLOUD.key,
      'Content-Type':'application/json', Prefer:'return=representation'}}, opts||{}));
  const txt=await r.text();
  if(!r.ok) throw new Error('HTTP '+r.status+' '+txt.slice(0,140));
  return txt?JSON.parse(txt):null;
}
function mergeDB(local, remote, remoteNewer){
  const out=Object.assign({},local);
  out.meta = remoteNewer ? Object.assign({},local.meta,remote.meta||{}) : Object.assign({},remote.meta||{},local.meta);
  const tombs=new Set((local.tombs||[]).concat(remote.tombs||[]));
  SYNCABLE.forEach(k=>{
    const first = remoteNewer ? (local[k]||[]) : (remote[k]||[]);
    const second= remoteNewer ? (remote[k]||[]) : (local[k]||[]);
    const map=new Map();
    first.concat(second).forEach(x=>{ if(x&&x.id&&!tombs.has(x.id)) map.set(x.id,x); });
    out[k]=[...map.values()];
  });
  out.tasks=(out.tasks||[]).filter(t=>!tombs.has(t.key));
  out.tombs=[...tombs].slice(-4000);
  if(out.logins&&out.logins.length>300) out.logins=out.logins.slice(-300);
  return out;
}
function queueSync(){
  if(!cloudOn()) return;
  CLOUD.dirty=true; storeCloud();          // there is something here the cloud has not seen
  if(SYNC.s!=='busy') setSync('wait','Saving to the cloud\u2026');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(true), 1500);
}
async function syncNow(silent){
  if(!cloudOn()||syncing) return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){ setSync('bad','No signal \u2014 will send later'); return; }
  syncing=true;
  const q='farm_state?id=eq.'+encodeURIComponent(CLOUD.farm);
  try{
    // 1. a tiny question: has anything changed up there? (a few bytes, not the whole farm)
    const head=await api(q+'&select=rev,updated_by,updated_at');
    const row=head&&head[0];

    // 2. nothing new and nothing of ours to send \u2014 stop here, this is the cheap path
    if(row && row.rev===CLOUD.rev && !CLOUD.dirty){
      CLOUD.lastAt=new Date().toISOString(); storeCloud();
      setSync('ok','In step \u00b7 checked '+ftime(CLOUD.lastAt));
      if(!silent) toast('Everything is in step.');
      syncing=false; return;
    }

    let rev=CLOUD.rev||0, changed=!row;
    if(row){
      rev=row.rev;
      if(row.rev!==CLOUD.rev){                      // somebody else wrote \u2014 now pull the records
        setSync('busy','Getting what changed\u2026');
        const full=await api(q+'&select=rev,data');
        const r2=full&&full[0];
        if(r2){ db=mergeDB(db, r2.data||{}, !CLOUD.dirty); rev=r2.rev; changed=true; }
      }
    }
    if(changed||CLOUD.dirty){
      setSync('busy','Sending\u2026');
      const body=[{id:CLOUD.farm, rev:rev+1, data:db, updated_at:new Date().toISOString(),
        updated_by:(SESSION?SESSION.name:'device')}];
      const saved=await api('farm_state?on_conflict=id',{method:'POST',
        headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'Content-Type':'application/json',
          Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
      CLOUD.rev=(saved&&saved[0]?saved[0].rev:rev+1);
    } else CLOUD.rev=rev;
    migrateUsers();
    CLOUD.dirty=false; CLOUD.lastAt=new Date().toISOString(); storeCloud();
    try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}
    setSync('ok','In step \u00b7 '+ftime(CLOUD.lastAt));
    if(!silent) toast('Everything is in step.');
    if(SESSION||!db.users.length) render();
  }catch(e){
    if(CLOUD){ CLOUD.dirty=true; storeCloud(); }    // keep it queued, try again on the next round
    setSync('bad','Not sent yet: '+e.message);
    if(!silent) toast('Sync failed. '+e.message);
  }finally{ syncing=false; }
}
function syncCode(){
  if(!cloudOn()||role()!=='admin') return '';
  try{ return btoa(JSON.stringify({u:CLOUD.url,k:CLOUD.key,f:CLOUD.farm})); }catch(e){ return ''; }
}
function connectCloud(url,key,farm){
  CLOUD={url:url.trim(),key:key.trim(),farm:(farm||('farm_'+uid('')+uid(''))).trim(),rev:0,dirty:true};
  storeCloud(); syncNow(); 
}
function vCloud(){
  const on=cloudOn();
  let h=`<button class="backlink" onclick="go('more')">\u2039 More</button><h1>Cloud sync</h1>
  <div class="small muted" style="margin-bottom:10px">Keeps every phone on the same records. Each phone still
  works with no signal and catches up later.</div>`;
  if(on){
    h+=`<div class="card"><div class="spread"><div><b>${CLOUD.dirty?'Connected \u00b7 something still to send':'Connected'}</b>
      <div class="small muted">${esc(SYNC.msg)}</div>
      <div class="tiny muted">It sends a moment after you save, and checks for other people's entries every
      10 seconds while the app is open \u2014 also when you switch back to it and when signal returns.</div></div>
      <button class="btn sm" onclick="syncNow()">Sync now</button></div>
      <hr class="sep">
      <div class="small"><span class="muted">Farm code:</span> ${esc(CLOUD.farm)}</div>
      <div class="small"><span class="muted">Last change by:</span> ${esc((db.meta&&db.meta.encoder)||'\u2014')}</div>
    </div>
    ${role()==='admin'?`<div class="card"><b class="small">Add another phone</b>
      <div class="small muted" style="margin:4px 0 8px">Open this same web address on the other phone, go to
      More \u2192 Cloud sync \u2192 Paste a sync code, and paste the code below. Keep it private \u2014 anyone with it
      can read your records.</div>
      <div class="code" id="scode">${esc(syncCode())}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" onclick="copyCode()">Copy the code</button>
        <button class="btn ghost sm" onclick="disconnectCloud()">Disconnect this phone</button></div></div>`
    :`<div class="card small muted">This phone is on the farm's records. Only the admin can add another phone
      or disconnect this one.</div>`}`;
  } else {
    h+=`<div class="card"><b class="small">This phone is not connected</b>
      <div class="small muted" style="margin:4px 0 10px">Records stay on this phone only.</div>
      <button class="btn wide" style="margin-bottom:8px" onclick="askJoin()">Paste a sync code</button>
      ${role()==='admin'?`<button class="btn ghost wide" onclick="askCloudSetup()">Set up the first connection</button>`:''}</div>
    <div class="card small"><b>How the first connection is made</b>
      <div class="muted" style="margin-top:5px">Make a free project at supabase.com, open the SQL editor,
      run the few lines in the setup screen, then copy the Project URL and the anon key into this app.
      One phone does this once; the rest just paste the sync code.</div></div>`;
  }
  return h;
}
function copyCode(){
  const t=syncCode();
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('Code copied.'),()=>toast('Press and hold the code to copy.')); }
  else toast('Press and hold the code to copy.');
}
function disconnectCloud(){
  if(role()!=='admin') return toast('Only the admin can disconnect a phone.');
  confirmBox('Stop syncing on this phone? The records already here stay.',()=>{
    CLOUD=null; storeCloud(); setSync('off','Not connected'); toast('Disconnected.'); render(); });
}
function askJoin(){
  modal('Paste a sync code','Get this from the phone that is already connected: More \u2192 Cloud sync.',
   [{k:'c',label:'Sync code',type:'textarea',req:true,ph:'a long line of letters and numbers'}],
   'Connect',o=>{
     let d=null; try{ d=JSON.parse(atob(o.c.trim())); }catch(e){}
     if(!d||!d.u||!d.k||!d.f) return toast('That code is not readable. Copy the whole line.');
     connectCloud(d.u,d.k,d.f);
     toast('Connecting\u2026');
     if(SESSION) go('cloud'); else { LOGIN_PICK=null; render(); }
   });
}
function askCloudSetup(){
  if(role()!=='admin') return toast('Only the admin sets up the first connection.');
  const sql='create table if not exists farm_state (\n'+
    '  id text primary key,\n  rev int default 0,\n  data jsonb,\n'+
    '  updated_at timestamptz default now(),\n  updated_by text\n);\n'+
    'alter table farm_state enable row level security;\n'+
    'create policy farm_rw on farm_state for all to anon using (true) with check (true);';
  modal('Connect to Supabase','Do this once, on one phone. The other phones only need the sync code afterwards.',[
    {k:'url',label:'Project URL',req:true,ph:'https://abcdefgh.supabase.co',
     hint:'Supabase \u2192 Project settings \u2192 Data API'},
    {k:'key',label:'anon public key',req:true,ph:'eyJhbGciOi\u2026',
     hint:'The same page, under Project API keys. Use the anon key, never the service key.'},
    {k:'farm',label:'Farm code',val:'farm_'+uid('')+uid(''),
     hint:'A private name for your records. Anyone holding this plus the key can read them, so keep it long.'}
  ],'Connect',o=>{ connectCloud(o.url,o.key,o.farm); toast('Connecting\u2026'); go('cloud'); },
  `<div class="card tight"><b class="small">1. Run this in the Supabase SQL editor</b>
   <div class="code" style="margin-top:6px">${esc(sql)}</div></div>`);
}
/* ============================================================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MODAL) closeModal(); });
$('encoderBtn').onclick=accountMenu;
$('syncBtn').onclick=()=>{ if(cloudOn()) syncNow(); else { if(SESSION) go('cloud'); else toast('Sign in first.'); } };
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',()=>syncNow(true));   // coming back, and leaving
}
try{
  window.addEventListener('online', ()=>syncNow(true));              // signal came back
  window.addEventListener('focus', ()=>{ if(CLOUD&&CLOUD.dirty) syncNow(true); });
  window.addEventListener('pagehide', ()=>{ if(CLOUD&&CLOUD.dirty) syncNow(true); });
}catch(e){}
setInterval(()=>{                                  // every 10s while you are looking at it
  if(typeof document!=='undefined'&&document.hidden) return;
  syncNow(true);
}, 10000);
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
load().then(()=>{ loadCloud(); migrateUsers(); restoreSession(); render(); syncChip();
  if(cloudOn()){ setSync('busy','Syncing…'); syncNow(true); } });

</script>
